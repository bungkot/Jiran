upstream agent_workers {
    server agent-1:8765 max_fails=2 fail_timeout=10s;
    server agent-2:8765 max_fails=2 fail_timeout=10s;
}

upstream agent_1 {
    server agent-1:8765;
}

upstream agent_2 {
    server agent-2:8765;
}

server {
    listen 8765;

    location ~ ^/goals/agent-1_[0-9a-f]{32}$ {
        proxy_pass http://agent_1;
    }

    location ~ ^/goals/agent-2_[0-9a-f]{32}$ {
        proxy_pass http://agent_2;
    }

    location / {
        proxy_pass http://agent_workers;
    }
}
