resolver 127.0.0.11 valid=5s ipv6=off;

upstream agent_workers {
    zone agent_workers 64k;
    server agent-1:8765 resolve max_fails=2 fail_timeout=10s;
    server agent-2:8765 resolve max_fails=2 fail_timeout=10s;
    server agent-3:8765 resolve max_fails=2 fail_timeout=10s;
}

upstream agent_1 {
    zone agent_1 64k;
    server agent-1:8765 resolve;
}

upstream agent_2 {
    zone agent_2 64k;
    server agent-2:8765 resolve;
}

upstream agent_3 {
    zone agent_3 64k;
    server agent-3:8765 resolve;
}

server {
    listen 8765;

    location = /metrics {
        return 404;
    }

    location ~ "^/goals/agent-1_[0-9a-f]{32}$" {
        proxy_pass http://agent_1;
    }

    location ~ "^/goals/agent-2_[0-9a-f]{32}$" {
        proxy_pass http://agent_2;
    }

    location ~ "^/goals/agent-3_[0-9a-f]{32}$" {
        proxy_pass http://agent_3;
    }

    location / {
        proxy_pass http://agent_workers;
    }
}
