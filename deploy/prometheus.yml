global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: jiran-agent
    static_configs:
      - targets: ["agent-1:8765"]
        labels:
          agent_id: agent-1
      - targets: ["agent-2:8765"]
        labels:
          agent_id: agent-2

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
