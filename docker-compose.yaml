# Compose CANONICAL untuk seluruh stack Jiran.
#
# Jalankan dari folder ini:
#   docker compose up -d
# Jalankan dari root repository:
#   docker compose up -d --build
#
# JIRAN_ROOT boleh dioverride bila folder proyek dipindah; default-nya ${PWD}.
# Path host dan container sengaja SAMA agar bind mount docker-in-docker valid.

name: ${COMPOSE_PROJECT_NAME:-jiran}

x-airflow-common: &airflow-common
  image: jiran-airflow:local
  build:
    context: ./airflow
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow
  volumes:
    - airflow_logs:/opt/airflow/logs
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./scripts/benchmark_models.py:/opt/airflow/benchmark_models.py:ro
    - ./scripts/selfheal.py:/opt/airflow/selfheal.py:ro
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ${OLLAMA_MODELS_DIR:-${HOME}/.ollama}:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    expose:
      - "11434"
    environment:
      # Satu model, satu request: agent berjalan serial, jadi paralelisme hanya
      # menambah konsumsi memori. keep_alive menahan model di memori antar putaran
      # (cold-load adalah sumber timeout pada model besar).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # GPU NVIDIA (butuh nvidia-container-toolkit): hapus komentar blok berikut.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}"]
    restart: "no"

  # Exporter mini Ollama → Prometheus: polling GET /api/version, keluar metrik
  # ollama_up / ollama_response_ms (Ollama native /metrics 404 di build ini).
  ollama-exporter:
    image: python:3.13-slim
    working_dir: /app
    command: ["python", "ollama_exporter.py", "--url", "http://ollama:11434"]
    volumes:
      - ./scripts/ollama_exporter.py:/app/ollama_exporter.py:ro
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    expose:
      - "9191"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9191', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped

  agent-1:
    build: .
    image: coding-agent:local
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    command: serve
    expose:
      - "8765"
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8765}:8765"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-15}
      MAX_AGENT_TOOL_CALLS: ${MAX_AGENT_TOOL_CALLS:-30}
      MAX_GOAL_ITER: ${MAX_GOAL_ITER:-5}
      MAX_GOAL_ITER_LIMIT: ${MAX_GOAL_ITER_LIMIT:-50}
      REQUIRE_JUDGE_ON_FAST_PATH: ${REQUIRE_JUDGE_ON_FAST_PATH:-false}
      MAX_FIX_ITER: ${MAX_FIX_ITER:-3}
      COMMAND_TIMEOUT_S: ${COMMAND_TIMEOUT_S:-300}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-}
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-none}
      AGENT_SANDBOX_MEMORY_MB: ${AGENT_SANDBOX_MEMORY_MB:-256}
      AGENT_SANDBOX_CPUS: ${AGENT_SANDBOX_CPUS:-1}
      AGENT_SANDBOX_PIDS_LIMIT: ${AGENT_SANDBOX_PIDS_LIMIT:-128}
      AGENT_SANDBOX_MIN_FREE_DISK_MB: ${AGENT_SANDBOX_MIN_FREE_DISK_MB:-256}
      AGENT_SANDBOX_DISK_QUOTA_MB: ${AGENT_SANDBOX_DISK_QUOTA_MB:-0}
      # Wajib: endpoint /goals dapat memicu agent menulis file dan menjalankan
      # perintah. Service bind 0.0.0.0 di dalam container, jadi token tidak boleh
      # kosong. Minimal 32 karakter (Settings memvalidasi ini saat startup).
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN wajib diisi, min. 32 karakter}
      WORKSPACE_DIR: ${JIRAN_ROOT:-${PWD}}/workspace
      AGENT_LOGS_DIR: ${JIRAN_ROOT:-${PWD}}/logs
      AGENT_SERVICE_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8765
      AGENT_SERVICE_URL: http://agent-1:8765
      AGENT_INSTANCE_ID: agent-1
      AGENT_CONTAINER_DOCKER_SOCKET: ${AGENT_CONTAINER_DOCKER_SOCKET:-false}
    volumes:
      - ${JIRAN_ROOT:-${PWD}}/workspace:${JIRAN_ROOT:-${PWD}}/workspace
      - ${JIRAN_ROOT:-${PWD}}/logs:${JIRAN_ROOT:-${PWD}}/logs
      # Diperlukan agent untuk menjalankan verifikasi di container bersarang.
      # PERINGATAN: akses Docker daemon = setara root host. Batasi akses ke
      # endpoint /goals dengan token dan jangan ekspos ke jaringan publik.
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-991}"
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  itsm:
    build:
      context: ./itsm
    image: jiran-itsm:local
    depends_on:
      agent-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ITSM_PORT:-3000}:3000"
    environment:
      AGENT_SERVICE_URL: http://agent-1:8765
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN wajib diisi, min. 32 karakter}
      ITSM_SYSTEM_TOKEN: ${ITSM_SYSTEM_TOKEN:-${AGENT_API_TOKEN}}
      ITSM_DATA_DIR: /data/itsm
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - itsm_data:/data/itsm
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent-2:
    profiles: ["legacy-scaling"]
    build: .
    image: coding-agent:local
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    command: serve
    expose:
      - "8765"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-15}
      MAX_AGENT_TOOL_CALLS: ${MAX_AGENT_TOOL_CALLS:-30}
      MAX_GOAL_ITER: ${MAX_GOAL_ITER:-5}
      MAX_GOAL_ITER_LIMIT: ${MAX_GOAL_ITER_LIMIT:-50}
      REQUIRE_JUDGE_ON_FAST_PATH: ${REQUIRE_JUDGE_ON_FAST_PATH:-false}
      MAX_FIX_ITER: ${MAX_FIX_ITER:-3}
      COMMAND_TIMEOUT_S: ${COMMAND_TIMEOUT_S:-300}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-}
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-none}
      AGENT_SANDBOX_MEMORY_MB: ${AGENT_SANDBOX_MEMORY_MB:-256}
      AGENT_SANDBOX_CPUS: ${AGENT_SANDBOX_CPUS:-1}
      AGENT_SANDBOX_PIDS_LIMIT: ${AGENT_SANDBOX_PIDS_LIMIT:-128}
      AGENT_SANDBOX_MIN_FREE_DISK_MB: ${AGENT_SANDBOX_MIN_FREE_DISK_MB:-256}
      AGENT_SANDBOX_DISK_QUOTA_MB: ${AGENT_SANDBOX_DISK_QUOTA_MB:-0}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN wajib diisi, min. 32 karakter}
      WORKSPACE_DIR: ${JIRAN_ROOT:-${PWD}}/workspace
      AGENT_LOGS_DIR: ${JIRAN_ROOT:-${PWD}}/logs
      AGENT_SERVICE_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8765
      AGENT_SERVICE_URL: http://agent-lb:8765
      AGENT_INSTANCE_ID: agent-2
      AGENT_CONTAINER_DOCKER_SOCKET: ${AGENT_CONTAINER_DOCKER_SOCKET:-false}
    volumes:
      - ${JIRAN_ROOT:-${PWD}}/workspace:${JIRAN_ROOT:-${PWD}}/workspace
      - ${JIRAN_ROOT:-${PWD}}/logs:${JIRAN_ROOT:-${PWD}}/logs
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-991}"
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Worker ketiga (untuk autoscaler, lihat service autoscale bawah).
  agent-3:
    profiles: ["legacy-scaling"]
    build: .
    image: coding-agent:local
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    command: serve
    expose:
      - "8765"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-15}
      MAX_AGENT_TOOL_CALLS: ${MAX_AGENT_TOOL_CALLS:-30}
      MAX_GOAL_ITER: ${MAX_GOAL_ITER:-5}
      MAX_GOAL_ITER_LIMIT: ${MAX_GOAL_ITER_LIMIT:-50}
      REQUIRE_JUDGE_ON_FAST_PATH: ${REQUIRE_JUDGE_ON_FAST_PATH:-false}
      MAX_FIX_ITER: ${MAX_FIX_ITER:-3}
      COMMAND_TIMEOUT_S: ${COMMAND_TIMEOUT_S:-300}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-}
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-none}
      AGENT_SANDBOX_MEMORY_MB: ${AGENT_SANDBOX_MEMORY_MB:-256}
      AGENT_SANDBOX_CPUS: ${AGENT_SANDBOX_CPUS:-1}
      AGENT_SANDBOX_PIDS_LIMIT: ${AGENT_SANDBOX_PIDS_LIMIT:-128}
      AGENT_SANDBOX_MIN_FREE_DISK_MB: ${AGENT_SANDBOX_MIN_FREE_DISK_MB:-256}
      AGENT_SANDBOX_DISK_QUOTA_MB: ${AGENT_SANDBOX_DISK_QUOTA_MB:-0}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN wajib diisi, min. 32 karakter}
      WORKSPACE_DIR: ${JIRAN_ROOT:-${PWD}}/workspace
      AGENT_LOGS_DIR: ${JIRAN_ROOT:-${PWD}}/logs
      AGENT_SERVICE_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8765
      AGENT_SERVICE_URL: http://agent-lb:8765
      AGENT_INSTANCE_ID: agent-3
      AGENT_CONTAINER_DOCKER_SOCKET: ${AGENT_CONTAINER_DOCKER_SOCKET:-false}
    volumes:
      - ${JIRAN_ROOT:-${PWD}}/workspace:${JIRAN_ROOT:-${PWD}}/workspace
      - ${JIRAN_ROOT:-${PWD}}/logs:${JIRAN_ROOT:-${PWD}}/logs
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-991}"
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Autoscaler menjaga 1 worker dasar dan menambah kapasitas hanya untuk job konkuren.
  autoscale:
    profiles: ["legacy-scaling"]
    image: python:3.13-slim
    working_dir: /app
    command: ["python", "autoscale.py"]
    volumes:
      - ./scripts/autoscale.py:/app/autoscale.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOSCALE_SERVICES: "agent-1,agent-2,agent-3"
      AUTOSCALE_MAX: "3"
      AUTOSCALE_INTERVAL: "10"
      AUTOSCALE_DRAIN_GRACE_SECONDS: "60"
      AUTOSCALE_DOCKER_SOCKET: /var/run/docker.sock
      AUTOSCALE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-jiran}
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  agent-lb:
    profiles: ["legacy-scaling"]
    image: nginx:alpine
    depends_on:
      agent-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8765}:8765"
    volumes:
      - ./deploy/nginx-agent.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["monitoring"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    expose:
      - "9100"
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    depends_on:
      agent-1:
        condition: service_healthy
      node-exporter:
        condition: service_started
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  airflow-db:
    profiles: ["airflow"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-airflow@localhost}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        : "$${AIRFLOW__CORE__FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}"
        : "$${AIRFLOW__WEBSERVER__SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}"
        : "$${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}"
        airflow db migrate
        if airflow users list --output json | python -c 'import json, os, sys; sys.exit(0 if any(user.get("username") == os.environ["AIRFLOW_ADMIN_USERNAME"] for user in json.load(sys.stdin)) else 1)'; then
          echo "Airflow admin user already exists."
        else
          airflow users create \
            --username "$$AIRFLOW_ADMIN_USERNAME" \
            --firstname Airflow \
            --lastname Admin \
            --role Admin \
            --email "$$AIRFLOW_ADMIN_EMAIL" \
            --password "$$AIRFLOW_ADMIN_PASSWORD"
        fi
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    command: scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-environment
      AGENT_SERVICE_URL: http://agent-1:8765
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?AGENT_API_TOKEN wajib diisi, min. 32 karakter}
      ITSM_SYSTEM_URL: http://itsm:3000
      ITSM_SYSTEM_TOKEN: ${ITSM_SYSTEM_TOKEN:-${AGENT_API_TOKEN:?AGENT_API_TOKEN wajib diisi}}
      AIRFLOW_AGENT_JOB_TIMEOUT_S: "1800"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      SELFHEAL_WATCH: "agent-1,ollama"
      SELFHEAL_DOCKER_SOCKET: /var/run/docker.sock
      SELFHEAL_PROMETHEUS_URL: http://prometheus:9090
      SELFHEAL_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-jiran}
      SELFHEAL_DRY_RUN: ${SELFHEAL_DRY_RUN:-false}
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./scripts/benchmark_models.py:/opt/airflow/benchmark_models.py:ro
      - ./scripts/selfheal.py:/opt/airflow/selfheal.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-991}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0

  airflow-webserver:
    <<: *airflow-common
    profiles: ["airflow"]
    command: webserver
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

volumes:
  itsm_data:
  prometheus_data:
  grafana_data:
  airflow_db_data:
  airflow_logs:

