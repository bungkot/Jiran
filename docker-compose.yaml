services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${OLLAMA_MODELS_DIR:-${HOME}/.ollama}:/root/.ollama
    expose:
      - "11434"
    environment:
      # Satu model, satu request: agent berjalan serial, jadi paralelisme hanya
      # menambah konsumsi memori. keep_alive menahan model di memori antar putaran
      # (cold-load adalah sumber timeout pada model besar).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # GPU NVIDIA (butuh nvidia-container-toolkit): hapus komentar blok berikut.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen3.5:4b}"]
    restart: "no"

  agent:
    build: .
    image: coding-agent:local
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    command: serve
    ports:
      # Hanya loopback: siapa pun yang dapat mengirim goal dapat memicu eksekusi
      # kode lewat agent. Ubah ke 0.0.0.0 hanya bersama AGENT_API_TOKEN.
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8765}:8765"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-40000}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-20}
      MAX_AGENT_TOOL_CALLS: ${MAX_AGENT_TOOL_CALLS:-40}
      MAX_GOAL_ITER: ${MAX_GOAL_ITER:-9}
      MAX_FIX_ITER: ${MAX_FIX_ITER:-5}
      COMMAND_TIMEOUT_S: ${COMMAND_TIMEOUT_S:-300}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-}
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-none}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      WORKSPACE_DIR: ${PWD}/workspace
      AGENT_LOGS_DIR: ${PWD}/logs
      AGENT_SERVICE_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8765
      AGENT_CONTAINER_DOCKER_SOCKET: "true"
    volumes:
      - ${PWD}/workspace:${PWD}/workspace
      - ${PWD}/logs:${PWD}/logs
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-991}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

