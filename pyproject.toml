[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "Stack-neutral local coding agent with Docker-isolated tools"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "ollama>=0.6,<1",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
coding-agent = "agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: butuh Ollama sungguhan (set RUN_OLLAMA=1)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["UP042", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
files = ["src/agent"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
